    # tìm chữ "Vứt bỏ" trên màn hình trong vùng cột nút của popup (phân số
    # canvas: x0, y0, x1, y1) rồi bấm vào đó; giống dưới 0.65 thì dừng.
    discard_search_area: [0.64, 0.15, 0.82, 0.92]
    discard_min_score: 0.65
    confirm_point: [0.685, 0.631]
    sort_delay_seconds: 0.9
    detail_delay_seconds: 0.7
    confirm_delay_seconds: 0.7
    refresh_delay_seconds: 1.0
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  use_inventory_item:
    label: "Dùng vật phẩm"
    description: "Chọn ô trái hoặc ô phải rồi dùng tối đa 99 lần"
    icon: "🎁"
    runner: "use_item_loop"
    # Tâm 2 ô vật phẩm đầu tiên theo viewport của tab game.
    item_points:
      left: [0.337, 0.207]
      right: [0.689, 0.207]
    # Nút "Sử dụng" trong bảng chi tiết vật phẩm.
    use_point: [0.724, 0.345]
    # Loại vật phẩm này dùng ngay, không có hộp thoại xác nhận.
    confirm_point: null
    detail_delay_seconds: 0.7
    confirm_delay_seconds: 0.7
    refresh_delay_seconds: 1.0
    # Option "Ô trái ×99 + sắp xếp" dùng các thiết lập batch này.
    batch_sort_point: [0.813, 0.917]
    batch_sort_delay_seconds: 1.0
    # 0 = tiếp tục các batch 99 lượt đến khi bấm Stop.
    max_batches: 0
    # Tự kết thúc sau tối đa 99 lượt.
    max_cycles: 99
  warehouse_take:
    label: "Lấy đồ từ kho"
    description: "Lấy ô đầu kho vào hành trang rồi sắp xếp, lặp lại"
    icon: "📦"
    runner: "warehouse_take_loop"
    # Bấm chạy khi bảng Kho đang mở. Mỗi vòng: ô đầu tiên của kho (bên trái) ->
    # nút "Bỏ vào hành trang" trong bảng chi tiết -> "Đồng ý" ở hộp nhập số lượng
    # (game điền sẵn tối đa) -> "Sắp xếp kho hàng" để món kế dồn lên ô đầu.
    first_slot_point: [0.130, 0.270]
    # Cùng chỗ với nút "Sử dụng" của bảng chi tiết vật phẩm.
    take_point: [0.724, 0.345]
    # Đặt null nếu món không hỏi số lượng.
    amount_confirm_point: [0.490, 0.551]
    sort_point: [0.421, 0.897]
    detail_delay_seconds: 0.7
    amount_delay_seconds: 0.7
    refresh_delay_seconds: 1.0
    sort_delay_seconds: 1.0
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  coin_shake:
    label: "Rung xu"
    description: "Rung cây bằng xu rồi xác nhận liên tục"
    icon: "🪙"
    runner: "coin_shake_loop"
    shake_point: [0.585, 0.820]
    confirm_point: [0.685, 0.631]
    confirm_delay_seconds: 0.7
    result_delay_seconds: 1.2
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  blessing:
    label: "Cầu phúc"
    description: "Cầu phúc 10 lần liên tục đến khi Stop"
    icon: "福"
    runner: "blessing_loop"
    open_point: [0.73, 0.07]
    ten_times_point: [0.66, 0.84]
    ok_point: [0.70, 0.64]
    # Let each animation/result settle before sending the next interaction.
    # This avoids starving the renderer and tripping the site's guard.
    open_delay_seconds: 0.3
    click_delay_seconds: 0.2
    confirm_delay_seconds: 0.3
    result_delay_seconds: 0.7
    rest_every_cycles: 10
