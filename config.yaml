      menu_drag_from: [0.064, 0.86]
      menu_drag_to: [0.064, 0.40]
      menu_drag_times: 2
      scroll_seconds: 0.8
      # Vị trí H.Thống khi menu đã ở cuối (ảnh user: tâm nút ở 122,965 trên màn
      # 1920x1080, canvas bắt đầu ở y 81 -> 0.064, 0.922).
