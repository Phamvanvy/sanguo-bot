    # bước ra cửa (switch_actor_before) đổi nhân vật trước rồi mới đi ra.
    # Bấm UI chứ không gửi gói ACTOR_LOGIN: mục đích là để CHÍNH client dựng lại
    # trạng thái, gửi lén sau lưng nó thì màn hình vẫn là nhân vật cũ.
    # Đường bấm: H.Trang -> (mũi tên cuộn menu trái) H.Thống -> Đổi nhân vật -> ô NV.
