# Sanguo auto-quest bot config

game:
  url: "https://play.minhchauh5.com/"
  canvas_selector: "#screen"
  # Playwright persistent profile dir (keeps login/session between runs)
  profile_dir: "./.browser-profile"
  # The live site closes its game WebSocket when it detects a debugger/CDP
  # client. Keep normal runs on OS input; use CDP only for isolated debugging.
  # Values: auto | playwright_persistent | cdp_attach | os_input
  control_mode: "os_input"
  cdp:
    endpoint: "http://localhost:9222"
    auto_launch: true
    browser_exe: "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
    user_data_dir: "./.brave-cdp-profile"
    connect_timeout_seconds: 15
  os_input:
    # Tried switching to Edge (2026-07-10) to avoid colliding with the
    # user's everyday Brave window -- reverted immediately: this machine's
    # Edge is enterprise-managed (Entra "Work" profile, see the
    # "Asia Provisioning Policy WIN11 Entra" window and a policy-injected
    # "Clear Cache" extension). It ignored our --user-data-dir entirely and
    # opened the game as a tab inside the real signed-in Work profile --
    # not isolable, and not safe to keep automating against. Back to Brave,
    # which passed M0 cleanly with a fully separate profile dir.
    browser_exe: "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
    load_extension: true
    # Extension workers attach to the tab the user actually selected. Edge is
    # allowed as a fallback while still requiring the exact game window title.
    browser_exe_fallbacks:
      - "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
    # Send clicks directly to Chromium's render window so automation does not
    # move the user's real mouse cursor or steal foreground focus.
    background_clicks: true
    # Capture the selected Chromium HWND instead of pixels from the desktop,
    # allowing maximized game windows to remain behind one another.
    window_capture: true
    # Separate profile dir so this doesn't collide with the user's main
    # Brave profile/history/bookmarks.
    user_data_dir: "./.brave-os-profile"
    window_title_hint: "Minh Châu H5"
    # Filled in by tools/calibrate.py: the game canvas's position/size
    # *within the browser window*, as fractions of the window's client
    # area. Fractions only hold exactly for the fixed window.width/height
    # below (chrome/toolbar height is a constant pixel count, not a constant
    # fraction, so changing window size requires remeasuring).
    # Measured at window.width/height=1366x900 (logical) -- see
    # logs/boot_fixed_size.png / logs/canvas_crop_check2.png.
    # Recalibrated 2026-07-11 for actual client_rect 1350x666
    # (window was launched at 1366x900 outer but client area is 1350x666).
    # Canvas pixels: (4,80) to (1345,661) -> 1341x581
    canvas_region: {x: 0.003, y: 0.1201, w: 0.9933, h: 0.8724}
    # Extension controller converts these fixed browser chrome/canvas insets
    # to fractions at runtime, so maximized and 1366x900 windows both work.
    canvas_insets_px: {left: 4, top: 80, right: 5, bottom: 5}
  window:
    # Launched with --window-size/--window-position (plain Chromium flags,
    # not automation-related) so every run starts at the exact same size --
    # needed because the game's low native resolution means click-target
    # fractions only stay accurate if the window never gets ad-hoc resized.
    width: 1366
    height: 900
    pos_x: 0
    pos_y: 0

vision:
  ocr:
    # engine: auto | paddleocr | easyocr
    engine: "auto"
    lang: "vi"
    min_confidence: 0.5
  template:
    match_threshold: 0.82

llm:
  enabled: true
  # Qwen2.5-VL-3B-Instruct running on port 1234 for multimodal OCR fallback.
  # Lightweight 3B parameter model with vision capability, runs in ~2GB VRAM.
  base_url: "http://127.0.0.1:1234/v1"
  api_key: "not-needed"
  model: "qwen2.5-vl-3b-instruct"
  vision: true
  # Only invoked when OCR text for a quest detail is ambiguous / needs
  # structuring into {tag, title, target_npc, target_coord}. Because this
  # model is multimodal, vision/ocr.py can also route straight to it with
  # the cropped quest-row image instead of a two-step OCR-then-LLM pass --
  # worth trying first for the pixel-font Vietnamese text in M2.
  use_for_quest_parsing: true

memory:
  # SQLite store of quests seen + outcomes you log by hand (src/memory/store.py).
  db_path: "./data/memory.db"
  # local: TF-IDF cosine similarity, no network, no extra credentials.
  # cloud: OpenAI embeddings API -- requires cloud.openai_api_key in secrets.yaml.
  embedder: "local"
  cloud_embedding_model: "text-embedding-3-small"

quests:
  panel_name: "Nhiệm vụ quản lý"
  # Explicit allow/deny lists. Empty allow_tags = allow everything not denied.
  allow_tags: []
  deny_tags: []
  skip_titles: []
  max_attempts_per_quest: 3
  quest_timeout_seconds: 90
  poll_interval_seconds: 1.0

quest_actions:
  path_start_delay_seconds: 2.0
  return_settle_seconds: 2.0
  dialog_settle_seconds: 1.5
  npc_dialog_delay_seconds: 1.0
  auto_accept_nearby: true
  accept_map_quests_before_run: true
  max_map_quests_to_accept: 10
  # Built-in quest automation: white HUD rows are pending, green rows are ready to return.
  hud_row_click_x: 0.10
  hud_row_points: [0.265, 0.330, 0.395, 0.460]
  hud_text_x_range: [0.04, 0.18]
  hud_row_radius: 0.025
  hud_green_pixel_threshold: 80
  hud_white_pixel_threshold: 150
  hud_poll_seconds: 2.0
  auto_quest_timeout_seconds: 15.0
  max_hud_quest_clicks_per_run: 50
  tutorial_confirm_delay_seconds: 2.0
  max_tutorial_confirms: 5
  tutorial_mana_point: {x: 0.927, y: 0.653}
  map_open_delay_seconds: 1.0
  quest_marker_hsv_lower: [18, 120, 150]
  quest_marker_hsv_upper: [42, 255, 255]
  quest_marker_npc_offset_y: 0.09
  arrival_timeout_seconds: 20.0
  arrival_poll_seconds: 0.75
  arrival_stable_threshold: 0.035
  arrival_stable_samples: 3
  movement_roi: [0.24, 0.16, 0.50, 0.62]
  click_interval_seconds: 0.35
  collection_keywords: ["thu thap", "nhat", "hai", "luom", "dao", "lay", "tim"]
  combat_target_points:
    - [0.48, 0.50]
    - [0.42, 0.58]
    - [0.54, 0.60]
    - [0.47, 0.68]
  collection_target_points:
    - [0.48, 0.50]
    - [0.42, 0.57]
    - [0.55, 0.57]
    - [0.50, 0.65]
  combat_skill_points:
    - [0.86, 0.54]
    - [0.80, 0.66]
    - [0.79, 0.81]
    - [0.86, 0.82]
    - [0.94, 0.80]

# Các flow hoạt động hiển thị tự động trong popup extension.
activity_macros:
  auto_attack:
    label: "Tự động đánh"
    description: "Bấm 7 nút kỹ năng liên tục đến khi Stop"
    icon: "⚔"
    runner: "auto_attack_loop"
    # KHÔNG bấm nút Đánh nữa (user, 2026-09-21) - chỉ bấm các nút kỹ năng. Muốn
    # bật lại thì thêm attack_point: [0.927, 0.822] vào macro, content.js chỉ
    # bấm Đánh khi macro có khóa này.
    # Tọa độ theo viewport của tab game, đo từ cụm nút được khoanh trong ảnh.
    skill_points: &combat_skill_points
      - [0.927, 0.517]
      - [0.853, 0.566]
      - [0.799, 0.670]
      - [0.875, 0.710]
      - [0.927, 0.653]
      - [0.774, 0.820]
      - [0.845, 0.820]
    # Keep the renderer responsive so the site's debugger-latency guard does
    # not false-positive and close the game WebSocket under sustained load.
    button_delay_seconds: 0.2
    round_delay_seconds: 0.4
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  co_mo_hard: &co_mo_hard
    label: "Phó bản Cổ Mộ (khó)"
    description: "Vào bản khó qua NPC rồi đánh 3 boss ở 3 phòng"
    icon: "墓"
    runner: "dungeon_route"
    # Không có nút riêng: chạy qua thẻ "Phó bản Cổ Mộ" (co_mo_pipeline), như Hà
    # Đông / Thiên Long (user, 2026-09-23). Các macro khác merge từ đây cũng ẩn.
    hidden: true
    # Đọc dữ liệu game (gói tin WebSocket, xem extension/network_probe.js): biết vị
    # trí nhân vật, quái còn sống và lúc qua cổng -> hết quái thì đi tiếp ngay, tới
    # nơi thì làm bước sau luôn. fight_seconds / wait_seconds chỉ là giới hạn tối đa
    # (dùng khi không đọc được dữ liệu game). Tọa độ click đo trên canvas game.
    skill_points: *combat_skill_points
    button_delay_seconds: 0.2
    round_delay_seconds: 0.4
    map_button_point: [0.85, 0.07]
    map_open_delay_seconds: 1.2
    # Map không tự tắt sau khi chọn điểm và phím tắt không đóng được nó: mọi bước
    # có map_point BẮT BUỘC có map_close_point (nút X; vị trí đổi theo cỡ map).
    # Bước goto tự tính nút X từ map_size.
    map_close_delay_seconds: 0.6
    # Bước goto: [x, y] = tọa độ game hiện cạnh tên map (1 đơn vị = 8 pixel map).
    # Flow tự tìm đường trên lưới chỗ đi được của map (extension/walk_grids.js, tạo
    # từ dữ liệu map gốc bằng tools/assets/walk_grid.mjs), rồi mỗi lần mở Map bấm
    # điểm xa nhất trên đường mà Map đang hiện - mũi tên trên Map không cuộn được -
    # tới khi tới đích. Điểm bấm tính từ vị trí nhân vật và map_size.
    coord_unit: 8
    # Lệch tối đa ngần này ô so với tọa độ đã chỉ là tới (±1: boss hay đứng trên bệ
    # không lên được). Không tới được thì báo "bị chặn" rồi đánh ở chỗ gần nhất.
    # Cửa (portal: true) thì KHÔNG lệch: phải đứng đúng ô đã chỉ; không vào được
    # thì thử ô cửa theo dữ liệu map gốc cạnh đó (trong 3 ô).
    goto_tolerance: 1
    goto_leg_seconds: 60
    goto_idle_seconds: 5
    # Đứng yên ngần này giây mới tính là tới: đường xa game dừng thoáng giữa chừng
    # (Thiên Long: 0.8s làm mỗi lần chỉ đi được 5-7 ô rồi bấm lại).
    goto_settle_seconds: 2.5
    goto_max_legs: 12
    combat_check: true
    # Hết quái ĐANG ĐÁNH mình (đang tấn công hoặc đã mất máu) trong bán kính này
    # (pixel map) 3 lần liên tiếp = xong; quái đứng yên đầy máu (tượng) bỏ qua.
    monster_radius: 250
    clear_checks_needed: 3
    # Quái đứng yên đầy máu trong bán kính này cũng phải đánh: boss đứng yên tới
    # khi bị đánh (Thiên Long trận bỏ sót boss 2 vì luật cũ bỏ qua con đứng yên).
    idle_monster_radius: 160
    # Bấm Đánh ngần này giây mà không con nào quanh đó mất máu hay chết -> không
    # đánh được từ đây (tượng không chọn được, quái ngoài tầm nhìn): bỏ qua và đi
    # tiếp (Cổ Mộ 90,30 tượng 103 vòng vẫn 100%; Hà Đông 57,114 "Y quan phản
    # quân" 137 vòng vẫn 100%). CHỈ bỏ con còn đầy máu: con đã mất máu là đánh
    # được, dame yếu thì lâu chứ không bỏ. Boss đứng yên bị đánh là mất máu.
    stall_giveup_seconds: 30
    # Còn đánh trúng (đọc số sát thương từ gói tin) trong ngần này giây thì chưa
    # coi là hết quái: boss phó bản không nằm trong danh sách quái mà probe theo
    # dõi, nên chỉ có số sát thương mới biết boss còn sống. Để 6 giây thì hụt đòn
    # vài giây là flow bỏ đi trong khi boss còn máu (user, 2026-09-19).
    damage_grace_seconds: 15
    # Game báo không đánh được ("Mục tiêu không nằm trong tầm nhìn") thì bỏ hẳn
    # con đó rồi đi tiếp, khỏi treo bước (Hà Đông 57,114 từng đánh 218 giây).
    # Quái gần nhưng phải đi vòng quá ngần này ô mới tới (sau tường, như Hà Đông
    # ngoài) thì không tính: game báo "Mục tiêu không nằm trong tầm nhìn", bỏ qua.
    monster_path_tiles: 40
    # Không bao giờ tính vào "còn quái": tướng đi theo mình (Lữ Bố), tượng không
    # chết được (Tượng đá cơ quan, Tượng khắc thanh ngọc cơ quan ở Cổ Mộ - tên đọc
    # từ gói tin, đứng yên 100% máu mãi), vật không đánh được (Mật thư ở Hà Đông).
    ignore_monster_names: ["Lữ Bố", "Tượng đá cơ quan", "Tượng khắc thanh ngọc cơ quan", "Mật thư"]
    # Đang đi thì KHÔNG bấm Đánh: bấm là nhân vật đứng lại đánh quái quanh đó thay
    # vì đi tiếp. Tới nơi mới đánh; cổng còn khóa thì vẫn đánh rồi vào lại. Đặt
    # fight_on_the_way: true thì gặp quái đang đánh mình trong ambush_radius sẽ
    # dừng lại đánh (tối đa ambush_fight_seconds) rồi đi tiếp.
    fight_on_the_way: false
    ambush_radius: 150
    ambush_fight_seconds: 60
    # Bước portal: đứng ở cổng quá ngần này giây mà map không đổi = cổng còn khóa
    # (còn quái đánh mình) -> đánh hết rồi vào lại, quá max_rewalks lần thì báo lỗi.
    portal_settle_seconds: 2.5
    arrive_settle_seconds: 0.8
    map_load_seconds: 1.5
    max_rewalks: 3
    # Chạy xong cả phó bản thì phát tiếng chuông.
    finish_chime: true
    # Map sảnh Cổ Mộ Lạc Dương (id đọc từ gói tin). Bấm chạy khi đang ở map khác
    # (đã ở trong phó bản) thì bỏ qua các bước vào cửa, đi thẳng vào lộ trình.
    entry_map: 768
    # Bản dễ và khó cùng lộ trình, chỉ khác lối vào. Đang ở trong thì đi thẳng lộ
    # trình. Bản KHÓ: NPC "Đặc sứ triều đình Đông Hán" ở sảnh (~22,27, nơi nút cũ
    # bấm khi đứng ở 32,27) -> "Không ngại hiểm nguy, vào khiêu chiến" (user,
    # 2026-09-23). Sảnh 560x432 nằm gọn trong Map nên bấm NPC trên Map từ đâu
    # cũng được, client tự đi tới; không thấy tên trong dữ liệu game thì bấm ô
    # npc_tile.
    entry_steps:
      - {label: "Bấm NPC trên Map, chọn Không ngại hiểm nguy, vào khiêu chiến", touch_npc_by_map: "Đặc sứ triều đình Đông Hán", npc_tile: [22, 27], dialog_seconds: 20, map_size: &co_mo_lobby [560, 432], maps: &co_mo_lobby_maps [768], option_point: [0.500, 0.509], portal: true, wait_seconds: 15}
    # Mục tiêu là 3 boss ở 3 phòng riêng. Cửa phòng boss khóa khi còn quái đánh
    # mình: dọn quái trước cửa rồi mới vào; kẹt ở cửa thì flow đánh hết rồi vào lại.
    # Cỡ map theo dữ liệu gốc: khó 1137/1141/1139/1140, dễ 769/773/771/772 (cùng cỡ).
    # Bước dọn trước cửa KHÔNG đặt ignore_idle_monsters: quái con ở Cổ Mộ ("Xe đâm
    # húc", "Kẻ thăm dò cổ mộ") đứng yên đầy máu lúc mình tới, bỏ qua thì nó xông
    # vào đánh trên đường ra cửa và game chặn cửa (user, 2026-09-21: bản khó boss 1
    # báo không thông qua được vì còn quái con đánh; log 12:01 bước 1 xong sau 0.6s,
    # 0 vòng, "bỏ qua 3 con đứng yên"). Tượng không đánh được thì lọc bằng
    # ignore_monster_names, còn lại stall_giveup_seconds cắt sau 30 giây.
    route_steps:
      # "Xe đâm húc" đứng yên cách chỗ dọn 175-210 px, ngoài bán kính đứng yên
      # mặc định 160, nên bị bỏ qua rồi xông vào đánh lúc mình ra cửa 44,10 - cửa
      # khóa (user, 2026-09-23 23:41). Hai bước dọn trước cửa quét 250 px.
      - {label: "Dọn quái trước cửa boss 1 (38,12)", goto: [38, 12], map_size: &co_mo_main [800, 608], maps: &co_mo_main_maps [1137, 769], fight_seconds: 180, idle_monster_radius: 250}
      - {label: "Vào cửa boss 1 (44,10)", goto: [44, 10], map_size: *co_mo_main, maps: *co_mo_main_maps, portal: true}
      # Phòng boss 1: PHẢI phá hết xe và tượng thì boss mới xuất hiện (user,
      # 2026-09-21) - trước đây flow không thấy gì để đánh nên đi luôn, chưa kịp ra
      # boss. Nên bước này:
      #   clear_room: true         bỏ mọi đường tắt "thôi bỏ con này": không bỏ con
      #                            game báo không đánh được (ATTACK_FAIL 8/14 - xe,
      #                            tượng bị từ chối một lúc rồi mới đánh được), không
      #                            bỏ con mãi không mất máu. Chỉ fight_seconds chặn.
      #   ignore_monster_names     chỉ bỏ tướng đi theo mình; tượng ở ĐÂY là mục tiêu
      #                            thật, khác với tượng cảnh ngoài map chính.
      #   idle_monster_radius: 250 phòng 352x256 px, đứng ở 20,18 góc xa nhất ~221 px
      #                            nên phải bằng monster_radius mới quét hết phòng.
      # Vừa vào phòng boss 1 có một con quái ở ngay cửa: đánh tại chỗ cho xong con
      # đó rồi mới ra giữa phòng (user, 2026-09-23). Chỉ quét quanh cửa (128 px,
      # phòng rộng 352) để không kéo cả tượng giữa phòng - việc của bước sau.
      # Bản dễ (773) con ở cửa là "Xe đâm húc" cách ~102 px: 96 px bỏ sót nó,
      # đánh 0 vòng rồi đi (2026-09-24 16:59, 17:05); tượng bản khó cách 155 px.
      - {label: "Đánh quái ở cửa phòng boss 1 (tại chỗ)", map_size: &co_mo_boss1 [352, 256], maps: &co_mo_boss1_maps [1141, 773], fight_seconds: 60, monster_radius: 128, idle_monster_radius: 128}
      - {label: "Đánh boss 1 (20,18)", goto: [20, 18], map_size: *co_mo_boss1, maps: *co_mo_boss1_maps, fight_seconds: 180, idle_monster_radius: 250, clear_room: true, ignore_monster_names: ["Lữ Bố"]}
      - {label: "Ra cửa 31,24", goto: [31, 24], map_size: *co_mo_boss1, maps: *co_mo_boss1_maps, portal: true}
      - {label: "Dọn quái trước cửa boss 2 (90,30)", goto: [90, 30], map_size: *co_mo_main, maps: *co_mo_main_maps, fight_seconds: 180, idle_monster_radius: 250}
      # Cửa boss 2 đúng ô 83,34 (user, 2026-09-14): 84,32 và 85,33 đứng mãi không vào.
      - {label: "Vào cửa boss 2 (83,34)", goto: [83, 34], map_size: *co_mo_main, maps: *co_mo_main_maps, portal: true}
      - {label: "Đánh boss 2 (44,34)", goto: [44, 34], map_size: &co_mo_boss2 [560, 432], maps: &co_mo_boss2_maps [1139, 771], fight_seconds: 180}
      - {label: "Ra cửa 9,10", goto: [9, 10], map_size: *co_mo_boss2, maps: *co_mo_boss2_maps, portal: true}
      # Cửa boss 3: vòng lên 99,4 rồi xuống cửa, né quái chứ không dừng lại đánh.
      - {label: "Vòng lên 99,4 (né quái)", goto: [99, 4], map_size: *co_mo_main, maps: *co_mo_main_maps, ignore_ambush: true}
      - {label: "Vào cửa boss 3 (93,6)", goto: [93, 6], map_size: *co_mo_main, maps: *co_mo_main_maps, portal: true, ignore_ambush: true}
