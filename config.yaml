      # nó chọn để đối chiếu.
      # Chỉ đặt hai khóa dưới đây khi muốn ĐÈ lên kết quả tự dò (1-4); để null
      # là tự dò. Nếu probe không kịp thấy lúc đăng nhập (F5 tab game là thấy)
      # thì flow báo lỗi và bảo đặt actor_slot.
