      - {label: "Bấm NPC trên Map, chọn 1. Vào Thiên Long Trận chế độ Khó", touch_npc_by_map: "Thái Trường Trị", map_size: *thien_long_lobby, maps: *thien_long_lobby_maps, option_point: [0.5, 0.508], portal: true, wait_seconds: 15}
