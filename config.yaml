# Sanguo auto-quest bot config

game:
  url: "https://play.minhchauh5.com/"
  canvas_selector: "#screen"
  # Playwright persistent profile dir (keeps login/session between runs)
  profile_dir: "./.browser-profile"
  # The live site closes its game WebSocket when it detects a debugger/CDP
  # client. Keep normal runs on OS input; use CDP only for isolated debugging.
  # Values: auto | playwright_persistent | cdp_attach | os_input
  control_mode: "os_input"
  cdp:
    endpoint: "http://localhost:9222"
    auto_launch: true
    browser_exe: "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
    user_data_dir: "./.brave-cdp-profile"
    connect_timeout_seconds: 15
  os_input:
    # Tried switching to Edge (2026-07-10) to avoid colliding with the
    # user's everyday Brave window -- reverted immediately: this machine's
    # Edge is enterprise-managed (Entra "Work" profile, see the
    # "Asia Provisioning Policy WIN11 Entra" window and a policy-injected
    # "Clear Cache" extension). It ignored our --user-data-dir entirely and
    # opened the game as a tab inside the real signed-in Work profile --
    # not isolable, and not safe to keep automating against. Back to Brave,
    # which passed M0 cleanly with a fully separate profile dir.
    browser_exe: "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
    # Separate profile dir so this doesn't collide with the user's main
    # Brave profile/history/bookmarks.
    user_data_dir: "./.brave-os-profile"
    window_title_hint: "Minh Châu H5"
    # Filled in by tools/calibrate.py: the game canvas's position/size
    # *within the browser window*, as fractions of the window's client
    # area. Fractions only hold exactly for the fixed window.width/height
    # below (chrome/toolbar height is a constant pixel count, not a constant
    # fraction, so changing window size requires remeasuring).
    # Measured at window.width/height=1366x900 (logical) -- see
    # logs/boot_fixed_size.png / logs/canvas_crop_check2.png.
    # Recalibrated 2026-07-11 for actual client_rect 1350x666
    # (window was launched at 1366x900 outer but client area is 1350x666).
    # Canvas pixels: (4,80) to (1345,661) -> 1341x581
    canvas_region: {x: 0.003, y: 0.1201, w: 0.9933, h: 0.8724}
    # Extension controller converts these fixed browser chrome/canvas insets
    # to fractions at runtime, so maximized and 1366x900 windows both work.
    canvas_insets_px: {left: 4, top: 80, right: 5, bottom: 5}
  window:
    # Launched with --window-size/--window-position (plain Chromium flags,
    # not automation-related) so every run starts at the exact same size --
    # needed because the game's low native resolution means click-target
    # fractions only stay accurate if the window never gets ad-hoc resized.
    width: 1366
    height: 900
    pos_x: 0
    pos_y: 0

vision:
  ocr:
    # engine: auto | paddleocr | easyocr
    engine: "auto"
    lang: "vi"
    min_confidence: 0.5
  template:
    match_threshold: 0.82

llm:
  enabled: true
  # Qwen2.5-VL-3B-Instruct running on port 1234 for multimodal OCR fallback.
  # Lightweight 3B parameter model with vision capability, runs in ~2GB VRAM.
  base_url: "http://127.0.0.1:1234/v1"
  api_key: "not-needed"
  model: "qwen2.5-vl-3b-instruct"
  vision: true
  # Only invoked when OCR text for a quest detail is ambiguous / needs
  # structuring into {tag, title, target_npc, target_coord}. Because this
  # model is multimodal, vision/ocr.py can also route straight to it with
  # the cropped quest-row image instead of a two-step OCR-then-LLM pass --
  # worth trying first for the pixel-font Vietnamese text in M2.
  use_for_quest_parsing: true

memory:
  # SQLite store of quests seen + outcomes you log by hand (src/memory/store.py).
  db_path: "./data/memory.db"
  # local: TF-IDF cosine similarity, no network, no extra credentials.
  # cloud: OpenAI embeddings API -- requires cloud.openai_api_key in secrets.yaml.
  embedder: "local"
  cloud_embedding_model: "text-embedding-3-small"

quests:
  panel_name: "Nhiệm vụ quản lý"
  # Explicit allow/deny lists. Empty allow_tags = allow everything not denied.
  allow_tags: []
  deny_tags: []
  skip_titles: []
  max_attempts_per_quest: 3
  quest_timeout_seconds: 90
  poll_interval_seconds: 1.0

quest_actions:
  path_start_delay_seconds: 2.0
  return_settle_seconds: 2.0
  dialog_settle_seconds: 1.5
  npc_dialog_delay_seconds: 1.0
  auto_accept_nearby: true
  accept_map_quests_before_run: true
  max_map_quests_to_accept: 10
  map_open_delay_seconds: 1.0
  quest_marker_hsv_lower: [18, 120, 150]
  quest_marker_hsv_upper: [42, 255, 255]
  quest_marker_npc_offset_y: 0.09
  arrival_timeout_seconds: 20.0
  arrival_poll_seconds: 0.75
  arrival_stable_threshold: 0.035
  arrival_stable_samples: 3
  movement_roi: [0.24, 0.16, 0.50, 0.62]
  click_interval_seconds: 0.35
  collection_keywords: ["thu thap", "nhat", "hai", "luom", "dao", "lay", "tim"]
  combat_target_points:
    - [0.48, 0.50]
    - [0.42, 0.58]
    - [0.54, 0.60]
    - [0.47, 0.68]
  collection_target_points:
    - [0.48, 0.50]
    - [0.42, 0.57]
    - [0.55, 0.57]
    - [0.50, 0.65]
  combat_skill_points:
    - [0.86, 0.54]
    - [0.80, 0.66]
    - [0.79, 0.81]
    - [0.86, 0.82]
    - [0.94, 0.80]

# Các flow hoạt động hiển thị tự động trong popup extension.
activity_macros:
  auto_attack:
    label: "Tự động đánh"
    description: "Bấm Đánh và 7 nút kỹ năng liên tục đến khi Stop"
    icon: "⚔"
    runner: "auto_attack_loop"
    # Tọa độ theo viewport của tab game, đo từ cụm nút được khoanh trong ảnh.
    attack_point: [0.927, 0.822]
    skill_points:
      - [0.927, 0.517]
      - [0.853, 0.566]
      - [0.799, 0.670]
      - [0.875, 0.710]
      - [0.927, 0.653]
      - [0.774, 0.820]
      - [0.845, 0.820]
    # Keep the renderer responsive so the site's debugger-latency guard does
    # not false-positive and close the game WebSocket under sustained load.
    button_delay_seconds: 0.18
    round_delay_seconds: 0.3
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  blessing:
    label: "Cầu phúc"
    description: "Cầu phúc 10 lần liên tục đến khi Stop"
    icon: "福"
    runner: "blessing_loop"
    open_point: [0.73, 0.07]
    ten_times_point: [0.66, 0.84]
    ok_point: [0.70, 0.64]
    # Let each animation/result settle before sending the next interaction.
    # This avoids starving the renderer and tripping the site's guard.
    open_delay_seconds: 0.3
    click_delay_seconds: 0.2
    confirm_delay_seconds: 0.3
    result_delay_seconds: 0.7
    rest_every_cycles: 10
    rest_delay_seconds: 1
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  mch5exp_redeem:
    label: "Nhập code MCH5EXP"
    description: "Nhập MCH5EXP liên tục đến khi bấm Dừng"
    icon: "券"
    runner: "code_redeem_loop"
    # Mỗi lượt mở Map rồi bấm marker "Nhân viên đổi mã kích hoạt" được khoanh trong ảnh.
    map_point: [0.850, 0.070]
    npc_point: [0.397, 0.490]
    option_point: [0.50, 0.43]
    input_point: [0.50, 0.51]
    submit_point: [0.494, 0.556]
    notification_point: [0.500, 0.518]
    map_delay_seconds: 1.2
    open_delay_seconds: 2.0
    option_delay_seconds: 1.0
    submit_delay_seconds: 1.2
    dismiss_delay_seconds: 0.8
    reopen_delay_seconds: 1.0
    codes: ["MCH5EXP"]
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  star_reappraisal:
    label: "Giám định lại cấp sao"
    description: "Lặp Cấp sao → Giám định lại → Xác nhận đến khi Stop"
    icon: "★"
    runner: "star_reappraisal_loop"
    # Bắt đầu flow khi đang mở màn hình Luyện trang bị và đã chọn trang bị.
    star_button_point: [0.227, 0.869]
    reappraise_point: [0.498, 0.756]
    confirm_point: [0.499, 0.693]
    menu_delay_seconds: 1.2
    result_delay_seconds: 1.8
    next_cycle_delay_seconds: 1.2
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  mount_skill_learn:
    label: "Học kỹ năng thú cưỡi"
    description: "Chọn sách thứ 3 → Lĩnh ngộ → OK đúng 1 lần"
    icon: "🐎"
    runner: "mount_skill_learn_once"
    # Bắt đầu khi đang mở tab Thú cưỡi như ảnh mẫu.
    book_point: [0.289, 0.807]
    learn_point: [0.703, 0.224]
    confirm_point: [0.696, 0.628]
    detail_delay_seconds: 1.0
    confirm_delay_seconds: 0.8
    result_delay_seconds: 1.0
  gem_upgrade:
    label: "Nâng đá"
    description: "Nâng lần lượt 6 viên, mỗi viên 4 lần"
    icon: "◆"
    runner: "gem_upgrade_sequence"
    # Bắt đầu khi đang mở màn hình Luyện trang bị như ảnh mẫu.
    gem_points:
      - [0.109, 0.315]
      - [0.168, 0.315]
      - [0.227, 0.315]
      - [0.285, 0.315]
      - [0.344, 0.315]
      - [0.402, 0.315]
    upgrade_point: [0.365, 0.549]
    confirm_point: [0.697, 0.630]
    # Bấm mé trái banner; nếu banner đã tự tắt thì vùng bên dưới không chọn vật phẩm.
    notification_point: [0.200, 0.518]
    upgrades_per_gem: 4
    menu_delay_seconds: 1.2
    dialog_delay_seconds: 1.5
    confirm_delay_seconds: 1.5
    result_delay_seconds: 0.8
    repeat_delay_seconds: 1.2
    next_gem_delay_seconds: 1.0
  discard_items:
    label: "Vứt đồ"
    description: "Sắp xếp rồi vứt ô đầu tiên liên tục"
    icon: "🗑"
    runner: "discard_loop"
    # Tọa độ theo viewport của tab game như các flow không-chuột khác.
    sort_point: [0.796, 0.919]
    first_item_point: [0.342, 0.229]
    discard_point: [0.710, 0.502]
    confirm_point: [0.685, 0.631]
    sort_delay_seconds: 0.9
    detail_delay_seconds: 0.7
    confirm_delay_seconds: 0.7
    refresh_delay_seconds: 1.0
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0
  use_inventory_item:
    label: "Dùng vật phẩm"
    description: "Chọn ô trái hoặc ô phải rồi dùng tối đa 99 lần"
    icon: "🎁"
    runner: "use_item_loop"
    # Tâm 2 ô vật phẩm đầu tiên theo viewport của tab game.
    item_points:
      left: [0.337, 0.207]
      right: [0.689, 0.207]
    # Nút "Sử dụng" trong bảng chi tiết vật phẩm.
    use_point: [0.724, 0.345]
    # Loại vật phẩm này dùng ngay, không có hộp thoại xác nhận.
    confirm_point: null
    detail_delay_seconds: 0.7
    confirm_delay_seconds: 0.7
    refresh_delay_seconds: 1.0
    # Option "Ô trái ×99 + sắp xếp" dùng các thiết lập batch này.
    batch_sort_point: [0.813, 0.917]
    batch_sort_delay_seconds: 1.0
    # 0 = tiếp tục các batch 99 lượt đến khi bấm Stop.
    max_batches: 0
    # Tự kết thúc sau tối đa 99 lượt.
    max_cycles: 99
  coin_shake:
    label: "Rung xu"
    description: "Rung cây bằng xu rồi xác nhận liên tục"
    icon: "🪙"
    runner: "coin_shake_loop"
    shake_point: [0.585, 0.820]
    confirm_point: [0.685, 0.631]
    confirm_delay_seconds: 0.7
    result_delay_seconds: 1.2
    # 0 = lặp đến khi bấm Stop trong extension.
    max_cycles: 0

combat:
  hp_low_threshold_pct: 40
  hp_critical_threshold_pct: 20
  hp_potion_slot: "hp_potion"   # template name in templates/
  check_interval_seconds: 0.75

# Canvas-relative coordinates (0..1 of canvas width/height), NOT hard-coded
# pixels — kept resolution/DPI independent. Filled in by tools/calibrate.py.
ui:
  menu_button: null            # {x: 0.xx, y: 0.xx}
  active_quest: {x: 0.14, y: 0.23}
  interact_skill: {x: 0.86, y: 0.82}
  quest_dialog_action: {x: 0.86, y: 0.82}
  map_button: {x: 0.85, y: 0.07}
  available_quest_npc_fallback: null
  back_button: null
  quest_management_entry: null
  # Quest list panel region (fractions of canvas):
  # Measured from logs/quest_panel2.png (1679x1009 canvas).
  quest_row_start_x: 0.05      # left margin of quest text area
  quest_row_start_y: 0.12      # top of first quest row (below header)
  quest_row_height: 0.038      # each row height as fraction of canvas
  quest_row_click_x: 0.25      # X to click in the middle of a row
  # Quest detail panel (appears after clicking a row):
  claim_button_x: 0.78         # "Nhận thưởng" button
  claim_button_y: 0.85
  # HP potion slot (bottom toolbar):
  hp_potion_x: 0.5
  hp_potion_y: 0.92

runtime:
  dry_run: true          # when true: read + log intended actions, never click
  headless: false
  slow_mo_ms: 50
  log_dir: "./logs"
  save_debug_screenshots: true
