<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanguo G3b — browser client (map + sprites)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #d7dde3; overflow: hidden;
               font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #view { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  .panel { position: absolute; background: rgba(20,24,28,.92); border: 1px solid #2a3138;
           border-radius: 8px; padding: 12px 14px; backdrop-filter: blur(4px); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8fa3b0; margin: 0 0 8px; }
  .sub { color: #7d8b96; font-size: 12px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #8fa3b0; margin: 8px 0 2px; }
  input, select, button { font: inherit; }
  input, select { background: #11151a; color: #d7dde3; border: 1px solid #313a42;
                  border-radius: 5px; padding: 6px 8px; width: 100%; box-sizing: border-box; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 5px;
           padding: 7px 12px; cursor: pointer; margin: 8px 6px 0 0; }
  button:hover { background: #3d7cef; }
  button:disabled { background: #3a444d; cursor: default; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* login / character selection, centred until we are in the world */
  #enter { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; max-height: 88vh; overflow-y: auto; }
  #status { font-size: 12px; padding: 4px 0; color: #8fa3b0; }
  #status.ok { color: #6ddf8f; } #status.err { color: #ff7b72; }
  #charList button { display: block; width: 100%; text-align: left; background: #232c34; }
  #charList button:hover { background: #2c3742; }

  /* in-world HUD */
  #hud { top: 12px; left: 12px; font: 12px/1.6 ui-monospace, Consolas, monospace; color: #a9b7c2; }
  #hud b { color: #e6edf3; font-weight: 600; }
  #logPanel { right: 12px; bottom: 12px; width: 380px; }
  #log { height: 150px; overflow-y: auto; font: 11px/1.4 ui-monospace, Consolas, monospace; }
  #log .row { white-space: pre-wrap; }
  #log .in { color: #9ecbff; } #log .out { color: #7ee0a2; } #log .skip { color: #5c6771; }
  #log .err { color: #ff7b72; } #log .chat { color: #e3c07b; }
  #chatRow { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: end; }
  #chatRow button { margin: 0; }
  .hint { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #6f7c87; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="enter">
  <h1>Sanguo self-host — G3b client</h1>
  <p class="sub">Bản đồ và nhân vật vẽ trực tiếp từ dữ liệu gốc của server (không convert asset).</p>
  <div id="status">not connected</div>

  <div id="loginForm">
    <label for="url">Bridge WebSocket</label>
    <input id="url" value="ws://127.0.0.1:8080">
    <div class="row2">
      <div><label for="account">Account</label><input id="account" autocomplete="username"></div>
      <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
    </div>
    <button id="loginBtn">Log in</button>
  </div>

  <div id="characters" hidden>
    <h2>Characters</h2>
    <div id="charList"></div>
    <button id="refreshBtn">Refresh</button>
    <div id="createForm" hidden>
      <label for="charName">Create a character — name</label>
      <input id="charName" placeholder="letters, digits, _ (1–16 bytes)">
      <div class="row2">
        <div>
          <label for="sex">Sex</label>
          <select id="sex"><option value="0">Nam</option><option value="1">Nữ</option></select>
        </div>
        <div>
          <label for="faction">Faction</label>
          <select id="faction">
            <option value="1">1 — Ngụy</option><option value="2">2 — Thục</option><option value="3">3 — Ngô</option>
          </select>
        </div>
      </div>
      <button id="createBtn">Create</button>
    </div>
  </div>
</div>

<div class="panel" id="hud" hidden>
  <div><b id="who">—</b></div>
  <div id="where">—</div>
  <div id="perf">—</div>
  <div id="stats">—</div>
</div>

<div class="panel" id="logPanel" hidden>
  <div id="log"></div>
  <div id="chatRow">
    <div style="flex:1"><label for="chatText">Say (area chat)</label><input id="chatText"></div>
    <button id="chatSend">Send</button>
  </div>
</div>

<div class="hint" id="hint" hidden>Click to walk · WASD/arrows to step · +/− zoom</div>

<script type="module" src="./src/app/game-client.js"></script>
</body>
</html>
