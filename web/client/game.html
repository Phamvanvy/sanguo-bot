<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Minh Châu — self-host client</title>
<link rel="stylesheet" href="./src/ui/theme.css">
</head>
<body>
<canvas id="view"></canvas>

<!-- boot / asset preparation ------------------------------------------------------------- -->
<div class="screen" id="boot">
  <div style="text-align:center">
    <div class="wordmark">MINH CHÂU</div>
    <div class="tagline">Tam Quốc · máy chủ tự vận hành</div>
    <div class="track bar xp"><i id="bootFill"></i><span id="bootPct">0%</span></div>
    <div id="bootMsg">Đang chuẩn bị dữ liệu game…</div>
  </div>
</div>

<!-- login -------------------------------------------------------------------------------- -->
<div class="screen" id="login" hidden>
 <div class="stack">
  <div class="wordmark">MINH CHÂU</div>
  <div class="panel" style="--panel-w: 400px">
    <header><div class="plaque">Đăng nhập</div></header>
    <div class="body">
      <label class="label" for="account">Tên tài khoản</label>
      <input class="field" id="account" autocomplete="username" spellcheck="false">
      <label class="label" for="password">Mật khẩu</label>
      <input class="field" id="password" type="password" autocomplete="current-password">
      <label class="label" for="url">Máy chủ (bridge WebSocket)</label>
      <input class="field" id="url" spellcheck="false">
      <div id="status" style="margin-top:10px">Chưa kết nối</div>
    </div>
    <footer><button class="btn" id="loginBtn">Vào game</button></footer>
  </div>
 </div>
</div>

<!-- character select --------------------------------------------------------------------- -->
<div class="screen" id="select" hidden>
  <div class="panel" style="--panel-w: 720px">
    <header>
      <div class="plaque">Chọn nhân vật</div>
      <button class="close" id="selectBack" title="Đăng xuất">✕</button>
    </header>
    <div class="body">
      <div id="charList"></div>
      <div id="createForm" hidden style="margin-top:14px">
        <div class="plaque" style="display:inline-block;font-size:14px">Tạo nhân vật</div>
        <label class="label" for="charName">Tên (chữ, số, _ — tối đa 16 byte)</label>
        <input class="field" id="charName" spellcheck="false">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label class="label" for="sex">Giới tính</label>
            <select class="field" id="sex"><option value="0">Nam</option><option value="1">Nữ</option></select>
          </div>
          <div>
            <label class="label" for="faction">Phe</label>
            <select class="field" id="faction">
              <option value="1">Ngụy</option><option value="2">Thục</option><option value="3">Ngô</option>
            </select>
          </div>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px">
          <button class="btn green" id="createBtn">Tạo</button>
          <button class="btn" id="refreshBtn">Tải lại</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- in-world HUD ------------------------------------------------------------------------- -->
<div id="hud" hidden>
  <div id="vitals">
    <div id="portrait"></div>
    <div id="vitalBars">
      <div id="vitalName">—</div>
      <div class="bar hp"><i id="hpFill"></i><span id="hpText">—</span></div>
      <div class="bar mp"><i id="mpFill"></i><span id="mpText">—</span></div>
    </div>
  </div>

  <div id="place">—</div>

  <div id="actionBar">
    <button class="act" data-panel="character"><img alt=""><span>N.Vật</span></button>
    <button class="act" data-panel="bag"><img alt=""><span>H.Trang</span></button>
    <button class="act" data-panel="quest"><img alt=""><span>N.Vụ</span></button>
    <button class="act" data-panel="map"><img alt=""><span>Bản đồ</span></button>
    <button class="act" data-panel="menu"><img alt=""><span>Menu</span></button>
  </div>

  <div id="minimapBox">
    <canvas id="minimap" width="300" height="300"></canvas>
    <div class="cap">Chạm để đi tới</div>
  </div>

  <div id="pad"><div id="padKnob"></div></div>

  <div id="quickKeys">
    <button class="round" id="btnNames" title="Ẩn / hiện tên nhân vật">Tên</button>
    <button class="round" id="btnZoom" title="Phóng to / thu nhỏ">2x</button>
    <button class="round" id="btnDev" title="Nhật ký gói tin (F1)">Log</button>
    <button class="round big" id="btnChat">Chat</button>
  </div>

  <div id="chatDock">
    <div id="chatLog"></div>
    <div id="chatRow">
      <input class="field" id="chatText" placeholder="Nói chuyện trong khu vực…" maxlength="120">
      <button class="btn" id="chatSend">Gửi</button>
    </div>
  </div>

  <div id="expStrip"><i id="expFill"></i><span id="expText"></span></div>

  <div id="devPanel" hidden>
    <div id="devStats">—</div>
    <div id="devLog"></div>
  </div>
</div>

<div id="panels" hidden></div>
<div id="toast"></div>

<script type="module" src="./src/app/game-client.js"></script>
</body>
</html>
